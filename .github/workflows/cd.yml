name: CD

# master (after CI passes) -> images -> dev (automatic) -> production (manual approval).
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/sha to deploy (default: the dispatched ref). Use an older sha to roll back."
        required: false

concurrency:
  group: cd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: bergimax

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-images:
    name: Build and push images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: meta
        run: echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/calendariodocenti-backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/calendariodocenti-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/calendariodocenti-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/calendariodocenti-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy-dev:
    name: Deploy to dev (automatic)
    needs: build-images
    runs-on: ubuntu-latest
    environment: dev
    env:
      DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-images.outputs.tag }}
      # Dev = the same compose stack as `make up`, started from the exact commit being
      # promoted and smoke-tested end to end (health, login, authenticated API, frontend).
      - name: Start dev stack
        run: make up
      - name: Smoke test dev
        run: scripts/smoke_test.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.local.yml logs --tail=200
      # Optional persistent dev host: set secrets DEV_SSH_HOST / DEV_SSH_USER / DEV_SSH_KEY.
      - name: Deploy to persistent dev host
        if: env.DEV_SSH_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            cd ${{ secrets.DEV_APP_DIR || '~/calendarioDocenti' }}
            git fetch origin && git checkout ${{ needs.build-images.outputs.tag }}
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE_TAG=${{ needs.build-images.outputs.tag }} docker compose -f docker-compose.yml -f deploy/docker-compose.images.yml --env-file .env.production up -d
      - run: make down
        if: always()

  deploy-prod:
    name: Deploy to production (manual approval)
    needs: [build-images, deploy-dev]
    runs-on: ubuntu-latest
    # Configure Settings > Environments > production > "Required reviewers":
    # the job waits here until a maintainer approves it.
    environment:
      name: production
      url: https://130-110-14-231.sslip.io
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.PROD_APP_DIR || '~/calendarioDocenti' }}
            git fetch origin && git checkout ${{ needs.build-images.outputs.tag }}
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ needs.build-images.outputs.tag }}
            docker compose -f docker-compose.yml -f deploy/docker-compose.images.yml --env-file .env.production pull backend frontend
            docker compose -f docker-compose.yml -f deploy/docker-compose.images.yml --env-file .env.production up -d
            docker logout ghcr.io
      - name: Verify production health
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://130-110-14-231.sslip.io/health && exit 0
            sleep 5
          done
          echo "production health check failed" >&2
          exit 1
